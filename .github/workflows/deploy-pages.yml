# Builds the Vite app and publishes dist/ to GitHub Pages.
#
# Requires Settings → Pages → Build and deployment → Source = "GitHub Actions".
# With the older "Deploy from a branch" source, Pages serves the repository as-is
# — which for a Vite project means the unbuilt index.html and a blank screen.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/thermostep-mobile-prototype-yyx8mb']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build

      # enablement: true only creates a Pages site when none exists yet; it does
      # NOT convert a site already set to "Deploy from a branch" (verified: the
      # legacy "pages build and deployment" job kept firing after this ran).
      # That conversion is a repository setting a human must change.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
